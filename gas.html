<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheapest Gas</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--mut:#8b949e;--acc:#1f6feb;--ok:#3fb950}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:2;align-items:center}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
button{cursor:pointer;background:var(--acc);border-color:var(--acc)}button.g{background:var(--bg);border-color:var(--line)}
main{max-width:800px;margin:auto;padding:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.c.best{border-color:var(--ok)}
.c small{color:var(--mut);display:block}.c a{color:#58a6ff;text-decoration:none}
.price{font-size:22px;font-weight:800;white-space:nowrap;text-align:right}.price small{font-weight:400}
.pin{width:90px}.rank{color:var(--mut);width:24px;flex:0 0 24px}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
#status{padding:6px 10px;color:var(--mut);font-size:13px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:min(480px,95vw)}
dialog::backdrop{background:#0009}dialog input{width:100%}label{display:block;margin:8px 0 2px;color:var(--mut);font-size:13px}
nav#pages{display:flex;gap:6px;padding:8px 10px;background:#010409;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav#pages a{color:var(--fg);text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px}
nav#pages a.on{background:var(--acc);border-color:var(--acc)}
</style>
</head>
<body>
<nav id="pages"><a href="contacts-v2.html">👤 Kontakti</a><a href="bookmarks-v3.html">🔖 Bookmarks</a><a href="mysites-v4.html">🌐 Moje web stranice</a><a href="gas.html" class="on">⛽ Gas</a><a href="./">🏠 Stara</a></nav>
<header>
  <label style="margin:0">Radius <input id="radius" type="number" min="1" max="50" value="50" style="width:70px"> km</label>
  <button id="go">Load stations</button>
  <button class="g" id="loc">📍 My location</button>
  <button class="g" id="cfg">⚙ Start point</button>
  <a href="https://www.gasbuddy.com/gasprices/ontario/hamilton" target="_blank" rel="noopener noreferrer" style="color:#58a6ff;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px">⛽ GasBuddy Hamilton ↗</a>
</header>
<div id="status"></div>
<main id="list"></main>

<dialog id="sd"><form method="dialog">
  <h3>Start point</h3>
  <p style="color:var(--mut);font-size:13px">Default is approximately Hamilton, ON (near 21 Monte Court). Change it or use “My location”.</p>
  <label>Latitude</label><input id="lat" type="number" step="any">
  <label>Longitude</label><input id="lng" type="number" step="any">
  <div style="display:flex;gap:8px;margin-top:12px"><button value="save" id="save">Save</button><button value="cancel" class="g">Cancel</button></div>
</form></dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOME={lat:43.2325,lng:-79.7610};
const store={get:(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let origin={lat:+store.get('gas_lat',HOME.lat),lng:+store.get('gas_lng',HOME.lng)};
let stations=[];
let prices={};try{prices=JSON.parse(store.get('gas_prices','{}'))||{}}catch(e){}
const savePrices=()=>store.set('gas_prices',JSON.stringify(prices));
const setStatus=m=>{$('#status').textContent=m};

const km=(a,b)=>{
  const R=6371,r=x=>x*Math.PI/180,dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
};

async function load(){
  const maxKm=Math.min(50,Math.max(1,+$('#radius').value||50));
  $('#go').disabled=true;setStatus('Loading stations from OpenStreetMap…');
  const q=`[out:json][timeout:50];nwr["amenity"="fuel"](around:${maxKm*1000},${origin.lat},${origin.lng});out center tags 1500;`;
  try{
    const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));
    if(!r.ok)throw new Error('HTTP '+r.status+' — the free map server is busy, try again in a minute');
    stations=(await r.json()).elements.map(e=>{
      const t=e.tags||{},pos={lat:e.lat??e.center?.lat,lng:e.lon??e.center?.lon};
      const addr=[[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),t['addr:city']].filter(Boolean).join(', ');
      return {id:e.type+e.id,name:t.name||t.brand||t.operator||'Gas station',addr,pos,dist:km(origin,pos)};
    }).filter(x=>Number.isFinite(x.pos.lat)&&x.dist<=maxKm);
    render();
  }catch(e){setStatus('Error: '+e.message);}
  $('#go').disabled=false;
}

function render(){
  const priced=id=>prices[id]?.p;
  const rows=[...stations].sort((a,b)=>{
    const pa=priced(a.id),pb=priced(b.id);
    if(pa!=null&&pb!=null)return pa-pb||a.dist-b.dist;
    if(pa!=null)return -1;if(pb!=null)return 1;
    return a.dist-b.dist;
  });
  const n=rows.filter(x=>priced(x.id)!=null).length;
  let best=true;
  $('#list').innerHTML=rows.map((x,i)=>{
    const p=prices[x.id],has=p?.p!=null,cls=has&&best?' best':'';if(has)best=false;
    const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.name+' '+(x.addr||x.pos.lat+','+x.pos.lng));
    return `<div class="c${cls}"><div class="rank">${i+1}</div>
      <div class="grow"><b>${esc(x.name)}</b><small>${esc(x.addr||'')}</small>
      <small>${x.dist.toFixed(1)} km · <a href="${esc(maps)}" target="_blank" rel="noopener noreferrer">Map / directions</a>${has?' · set '+esc(new Date(p.t).toLocaleDateString()):''}</small></div>
      <div><input class="pin" type="number" step="0.1" min="0" inputmode="decimal" placeholder="¢/L" data-id="${esc(x.id)}" value="${has?p.p:''}" aria-label="Price in cents per litre for ${esc(x.name)}"></div></div>`;
  }).join('')||'<p style="color:var(--mut)">No stations found.</p>';
  setStatus(`${rows.length} stations within ${$('#radius').value} km · ${n} with prices · enter prices in ¢/L, cheapest goes to the top`);
}

$('#list').addEventListener('change',e=>{
  const id=e.target.dataset?.id;if(!id)return;
  const v=parseFloat(e.target.value);
  if(Number.isFinite(v)&&v>0)prices[id]={p:v,t:Date.now()};else delete prices[id];
  savePrices();render();
});
$('#go').onclick=load;
$('#loc').onclick=()=>{
  if(!navigator.geolocation)return setStatus('Geolocation is not supported.');
  navigator.geolocation.getCurrentPosition(p=>{origin={lat:p.coords.latitude,lng:p.coords.longitude};load();},e=>setStatus('Location error: '+e.message));
};
$('#cfg').onclick=()=>{$('#lat').value=origin.lat;$('#lng').value=origin.lng;$('#sd').showModal();};
$('#save').onclick=()=>{
  const la=parseFloat($('#lat').value),lo=parseFloat($('#lng').value);
  if(Number.isFinite(la)&&Number.isFinite(lo)){origin={lat:la,lng:lo};store.set('gas_lat',la);store.set('gas_lng',lo);}
};
load();
</script>
</body>
</html>
