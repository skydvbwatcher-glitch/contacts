<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts v2</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--mut:#8b949e;--acc:#1f6feb}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
input,textarea,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
button{cursor:pointer;background:var(--acc);border-color:var(--acc)}button.g{background:var(--bg);border-color:var(--line)}button.d{background:#b62324;border-color:#b62324}
#q{flex:1;min-width:140px}main{max-width:800px;margin:auto;padding:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.c small{color:var(--mut);display:block}.c a{color:#58a6ff}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:min(480px,95vw)}
dialog::backdrop{background:#0009}label{display:block;margin:8px 0 2px;color:var(--mut);font-size:13px}
dialog input,dialog textarea,dialog select{width:100%}.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#status{padding:6px 10px;color:var(--mut);font-size:13px}
nav#pages{display:flex;gap:6px;padding:8px 10px;background:#010409;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav#pages a{color:var(--fg);text-decoration:none;padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px}
nav#pages a.on{background:var(--acc);border-color:var(--acc)}
</style>
</head>
<body>
<nav id="pages"><a href="contacts-v2.html" data-p="contacts-v2">👤 Kontakti</a><a href="bookmarks-v3.html" data-p="bookmarks-v3">🔖 Bookmarks</a><a href="mysites-v4.html" data-p="mysites-v4">🌐 Moje web stranice</a><a href="./">🏠 Stara</a></nav>
<script>document.querySelectorAll('#pages a').forEach(a=>{if(location.pathname.endsWith('/'+a.dataset.p+'.html'))a.className='on'})</script>
<header>
  <input id="q" type="search" placeholder="Search…">
  <button class="g" id="tc">Contacts</button><button class="g" id="tb">Bookmarks</button>
  <button id="add">+ Add</button>
  <button class="g" id="bk">Backup ⚙</button>
</header>
<div id="status"></div>
<main id="list"></main>

<dialog id="ed"><form method="dialog" id="f">
  <h3 id="edt">Contact</h3>
  <label>Name</label><input name="name" required>
  <label>Phone</label><input name="phone" type="tel">
  <label>Email</label><input name="email" type="email">
  <label>Address</label><input name="address">
  <label>Organization</label><input name="org">
  <label>Category</label><select name="category"><option>personal</option><option>work</option><option>family</option><option>other</option></select>
  <label>Notes</label><textarea name="notes" rows="3"></textarea>
  <div class="row"><button value="save">Save</button><button type="button" class="g" id="cx">Cancel</button><button type="button" class="d" id="del">Delete</button></div>
</form></dialog>

<dialog id="be"><form method="dialog" id="bf">
  <h3>Bookmark</h3>
  <label>Title</label><input name="title" required>
  <label>URL</label><input name="url" type="url" required>
  <label>Folder</label><input name="folder" list="folders">
  <datalist id="folders"></datalist>
  <div class="row"><button value="save">Save</button><button type="button" class="g" id="bcx">Cancel</button><button type="button" class="d" id="bdel">Delete</button></div>
</form></dialog>

<dialog id="bd">
  <h3>Backup &amp; Restore</h3>
  <p style="color:var(--mut);font-size:14px">Your data lives only in this browser's IndexedDB. Nothing ever overwrites it automatically. Every restore/import first saves a snapshot.</p>
  <div class="row">
    <button id="exp">Download backup (.json)</button>
    <button class="g" id="imp">Restore from file…</button>
    <button class="g" id="old">Import old list + bookmarks (merge)</button>
  </div>
  <input type="file" id="file" accept=".json" hidden>
  <h4>Local snapshots</h4>
  <div id="snaps"></div>
  <button class="g" id="snapnow">Take snapshot now</button>
  <h4>GitHub backup</h4>
  <label>Repo (owner/name)</label><input id="gr" placeholder="skydvbwatcher-glitch/contacts">
  <label>Path in repo</label><input id="gp" value="backups/contacts-backup.json">
  <label>Token (fine-grained, Contents: read/write; stored only on this device)</label><input id="gt" type="password">
  <div class="row"><button id="gup">Upload to GitHub</button><button class="g" id="gdn">Restore from GitHub</button></div>
  <div class="row"><button class="g" id="close">Close</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,contacts=[],bookmarks=[],editing=null,editingB=null,view='c';

const open=()=>new Promise((res,rej)=>{
  const r=indexedDB.open('contacts-v2',2);
  r.onupgradeneeded=()=>{const d=r.result;for(const n of ['contacts','bookmarks'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps',{keyPath:'ts'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'k'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
const tx=(store,mode,fn)=>new Promise((res,rej)=>{
  const t=db.transaction(store,mode),s=t.objectStore(store);let out;
  out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=t.onabort=()=>rej(t.error);
});
const loadAll=async()=>{contacts=await tx('contacts','readonly',s=>s.getAll());bookmarks=await tx('bookmarks','readonly',s=>s.getAll());};
const put=c=>tx('contacts','readwrite',s=>s.put(c));
const remove=id=>tx('contacts','readwrite',s=>s.delete(id));
const setStatus=m=>{$('#status').textContent=m};

async function snapshot(reason){
  await loadAll();
  if(!contacts.length&&!bookmarks.length&&reason!=='manual')return;
  await tx('snaps','readwrite',s=>s.put({ts:Date.now(),reason,data:contacts,bookmarks}));
  const all=await tx('snaps','readonly',s=>s.getAll());
  for(const o of all.slice(0,-15))await tx('snaps','readwrite',s=>s.delete(o.ts));
}
const payload=()=>JSON.stringify({app:'contacts-v2',version:2,exported:new Date().toISOString(),contacts,bookmarks},null,1);

async function replaceAll(list,reason,bm){
  await snapshot('before-'+reason);
  await tx('contacts','readwrite',s=>{s.clear();list.forEach(c=>s.put(norm(c)));});
  if(bm)await tx('bookmarks','readwrite',s=>{s.clear();bm.forEach(b=>s.put(normB(b)));});
  await loadAll();render();
}
const norm=c=>({id:c.id||crypto.randomUUID(),name:c.name||'',phone:c.phone||'',email:c.email||'',address:c.address||'',org:c.org||'',notes:c.notes||'',category:c.category||'personal',...(c.src?{src:c.src}:{})});
const normB=b=>({id:b.id||crypto.randomUUID(),title:b.title||'',url:b.url||'',folder:b.folder||'Other'});
function parse(text){
  const j=JSON.parse(text);const l=Array.isArray(j)?j:j.contacts;
  if(!Array.isArray(l))throw new Error('Not a contacts backup');
  return {list:l,bm:Array.isArray(j.bookmarks)?j.bookmarks:null};
}

function renderB(){
  const q=$('#q').value.toLowerCase();
  const l=bookmarks.filter(b=>!q||(b.title+' '+b.url+' '+b.folder).toLowerCase().includes(q));
  const g={};l.forEach(b=>(g[b.folder]=g[b.folder]||[]).push(b));
  $('#list').innerHTML=Object.keys(g).sort((a,b)=>a.localeCompare(b)).map(f=>`<h4 style="margin:14px 0 6px;color:var(--mut)">${esc(f)} (${g[f].length})</h4>`+g[f].sort((a,b)=>a.title.localeCompare(b.title)).map(b=>`<div class="c" data-id="${b.id}"><div><b>${esc(b.title)}</b><small><a href="${/^https?:/i.test(b.url)?esc(b.url):'#'}" target="_blank" rel="noopener">${esc(b.url)}</a></small></div><button class="g edit">Edit</button></div>`).join('')).join('')||'<p style="color:var(--mut)">No bookmarks.</p>';
  setStatus(`${bookmarks.length} bookmarks · saved on this device`);
}
function render(){
  $('#tc').style.background=view==='c'?'var(--acc)':'';$('#tb').style.background=view==='b'?'var(--acc)':'';
  if(view==='b')return renderB();
  const q=$('#q').value.toLowerCase();
  const l=contacts.filter(c=>!q||Object.values(c).join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  $('#list').innerHTML=l.map(c=>`<div class="c" data-id="${c.id}"><div><b>${esc(c.name)}</b>
    <small>${esc(c.org)} ${c.category?'· '+esc(c.category):''}</small>
    ${c.phone?`<small><a href="tel:${esc(c.phone.split('/')[0].replace(/[^+\d]/g,''))}">${esc(c.phone)}</a></small>`:''}
    ${c.email?`<small><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></small>`:''}
    ${c.address?`<small>${esc(c.address)}</small>`:''}${c.notes?`<small>${esc(c.notes)}</small>`:''}</div>
    <button class="g edit">Edit</button></div>`).join('')||'<p style="color:var(--mut)">No contacts.</p>';
  setStatus(`${contacts.length} contacts · saved on this device`);
}

function edit(c){
  editing=c;const f=$('#f');
  for(const k of ['name','phone','email','address','org','category','notes'])f.elements[k].value=c?c[k]:(k==='category'?'personal':'');
  $('#del').style.display=c?'':'none';$('#ed').showModal();
}
$('#add').onclick=()=>view==='b'?editB(null):edit(null);
$('#tc').onclick=()=>{view='c';render();};$('#tb').onclick=()=>{view='b';render();};
function editB(b){
  editingB=b;const f=$('#bf').elements;
  for(const k of ['title','url','folder'])f[k].value=b?b[k]:'';
  $('#folders').innerHTML=[...new Set(bookmarks.map(x=>x.folder))].map(x=>`<option value="${esc(x)}">`).join('');
  $('#bdel').style.display=b?'':'none';$('#be').showModal();
}
$('#bcx').onclick=()=>$('#be').close();
$('#bf').onsubmit=async e=>{
  const f=e.target.elements;
  await tx('bookmarks','readwrite',s=>s.put(normB({...(editingB||{}),title:f.title.value.trim(),url:f.url.value.trim(),folder:f.folder.value.trim()||'Other'})));
  await loadAll();render();
};
$('#bdel').onclick=async()=>{
  if(editingB&&confirm('Delete '+editingB.title+'?')){await snapshot('before-delete');await tx('bookmarks','readwrite',s=>s.delete(editingB.id));await loadAll();render();$('#be').close();}
};
$('#cx').onclick=()=>$('#ed').close();
$('#list').onclick=e=>{const d=e.target.closest('.c');if(d&&e.target.classList.contains('edit'))view==='b'?editB(bookmarks.find(b=>b.id===d.dataset.id)):edit(contacts.find(c=>c.id===d.dataset.id));};
$('#q').oninput=render;
$('#f').onsubmit=async e=>{
  const f=e.target.elements;
  const c=norm({...(editing||{}),name:f.name.value.trim(),phone:f.phone.value.trim(),email:f.email.value.trim(),address:f.address.value.trim(),org:f.org.value.trim(),category:f.category.value,notes:f.notes.value});
  await put(c);await loadAll();render();
};
$('#del').onclick=async()=>{
  if(editing&&confirm('Delete '+editing.name+'?')){await snapshot('before-delete');await remove(editing.id);await loadAll();render();$('#ed').close();}
};

const download=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
async function renderSnaps(){
  const all=(await tx('snaps','readonly',s=>s.getAll())).reverse();
  $('#snaps').innerHTML=all.map(s=>`<div class="row" style="margin:4px 0;align-items:center"><span style="flex:1;font-size:13px">${new Date(s.ts).toLocaleString()} · ${s.data.length} contacts${s.bookmarks?', '+s.bookmarks.length+' bookmarks':''} · ${esc(s.reason)}</span><button class="g" data-r="${s.ts}">Restore</button></div>`).join('')||'<small>None yet.</small>';
}
$('#bk').onclick=async()=>{
  $('#gr').value=localStorage.getItem('gh_repo')||'';$('#gp').value=localStorage.getItem('gh_path')||'backups/contacts-backup.json';$('#gt').value=localStorage.getItem('gh_token')||'';
  await renderSnaps();$('#bd').showModal();
};
$('#close').onclick=()=>$('#bd').close();
$('#exp').onclick=()=>download(`contacts-backup-${new Date().toISOString().slice(0,10)}.json`,payload());
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const {list:l,bm}=parse(await f.text());
    if(confirm(`Replace current data with ${l.length} contacts${bm?' and '+bm.length+' bookmarks':''} from file? A snapshot is saved first.`)){await replaceAll(l,'file-restore',bm);$('#bd').close();}
  }catch(err){alert('Failed: '+err.message);}
  e.target.value='';
};
$('#snapnow').onclick=async()=>{await snapshot('manual');await renderSnaps();};
$('#snaps').onclick=async e=>{
  const ts=e.target.dataset.r;if(!ts)return;
  const s=await tx('snaps','readonly',st=>st.get(+ts));
  if(confirm('Restore snapshot with '+s.data.length+' contacts?')){await replaceAll(s.data,'snapshot-restore',s.bookmarks);await renderSnaps();}
};
const PERSONAL=[['Imenik','https://sites.google.com/view/telefonskipretrazivac/imenik'],['Vipers Elite','https://sites.google.com/view/viperselite/home'],['Obiteljska Web Stranica','https://sites.google.com/view/radujkovic/home?authuser=0'],['Italo Disco Muzika','http://radiomaxitalo.com/'],['Twitch','https://www.twitch.tv/newxsound'],['Radio u Boji','http://www.radiouboji.com/'],['Radio u Boji Mobile','https://radiouboji.nicepage.io/'],['Contact List Book','https://skydvbwatcher-glitch.github.io/contacts/'],['Elite Security','https://sites.google.com/view/idchek/home'],['NewXSound','http://newxsound.blogspot.com/']];
const loadScript=src=>new Promise(r=>{const sc=document.createElement('script');sc.src=src;sc.onload=()=>r(true);sc.onerror=()=>r(false);document.head.appendChild(sc);});
const ls=k=>{try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}};
// Rebuilds the old page's lists: built-in data + the old page's saved edits/additions/deletions (same-origin localStorage)
async function importOld(){
  await loadScript('contacts-data.js');await loadScript('internet-bookmarks-data.js');
  const deleted=new Set(ls('contacts-deleted-v1')||[]);
  const saved=(ls('contacts-address-book-v1')||[]).filter(c=>c&&c.name);
  const byName=new Map(saved.map(c=>[c.name,c]));const builtIn=new Set((window.CONTACTS||[]).map(c=>c.name));
  const cl=(window.CONTACTS||[]).filter(c=>!deleted.has(c.name)).map(c=>({...c,...(byName.get(c.name)||{})}));
  saved.forEach(c=>{if(!builtIn.has(c.name))cl.push(c);});
  const have=new Set(contacts.map(c=>(c.name+'|'+c.phone).toLowerCase()));
  const addC=cl.filter(c=>!have.has((c.name+'|'+(c.phone||'')).toLowerCase())).map(norm);
  const delB=new Set(ls('internet-bookmark-deleted-items-v1')||[]);
  const keyB=b=>JSON.stringify([b.title,b.url,b.folder||'Other']);
  const bl=[...(window.INTERNET_BOOKMARKS||[]),...PERSONAL.map(([title,url])=>({title,url,folder:'My websites'})),...(ls('internet-bookmark-user-items-v1')||[])].filter(b=>b&&b.title&&b.url&&!delB.has(keyB(b)));
  const haveB=new Set(bookmarks.map(b=>b.title+'|'+b.url));
  const addB=bl.filter(b=>!haveB.has(b.title+'|'+b.url)).map(normB);
  await snapshot('before-old-import');
  await tx('contacts','readwrite',s=>addC.forEach(c=>s.put(c)));
  await tx('bookmarks','readwrite',s=>addB.forEach(b=>s.put(b)));
  await loadAll();render();
  return [addC.length,addB.length];
}
$('#old').onclick=async()=>{const [c,b]=await importOld();alert(c+' contacts and '+b+' bookmarks added (existing ones untouched).');};

const ghSave=()=>{localStorage.setItem('gh_repo',$('#gr').value.trim());localStorage.setItem('gh_path',$('#gp').value.trim());localStorage.setItem('gh_token',$('#gt').value.trim());};
const ghUrl=()=>`https://api.github.com/repos/${$('#gr').value.trim()}/contents/${$('#gp').value.trim().split('/').map(encodeURIComponent).join('/')}`;
const ghHead=()=>({Authorization:'Bearer '+$('#gt').value.trim(),Accept:'application/vnd.github+json'});
const b64=s=>{let b='';new TextEncoder().encode(s).forEach(x=>b+=String.fromCharCode(x));return btoa(b);};
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
$('#gup').onclick=async()=>{
  ghSave();
  try{
    const g=await fetch(ghUrl(),{headers:ghHead()});
    const sha=g.ok?(await g.json()).sha:undefined;
    if(!g.ok&&g.status!==404)throw new Error('GitHub '+g.status);
    const r=await fetch(ghUrl(),{method:'PUT',headers:ghHead(),body:JSON.stringify({message:'Contacts backup '+new Date().toISOString(),content:b64(payload()),sha})});
    if(!r.ok)throw new Error('GitHub '+r.status+' '+(await r.text()));
    alert('Uploaded '+contacts.length+' contacts.');
  }catch(err){alert('Upload failed: '+err.message);}
};
$('#gdn').onclick=async()=>{
  ghSave();
  try{
    const r=await fetch(ghUrl(),{headers:ghHead()});if(!r.ok)throw new Error('GitHub '+r.status);
    const {list:l,bm}=parse(unb64((await r.json()).content));
    if(confirm(`Replace current data with ${l.length} contacts${bm?' and '+bm.length+' bookmarks':''} from GitHub? A snapshot is saved first.`)){await replaceAll(l,'github-restore',bm);$('#bd').close();}
  }catch(err){alert('Restore failed: '+err.message);}
};

// One-way sync: the original page mirrors its list to localStorage; contacts it owns are marked src:'old'
async function syncFromOld(){
  let m;try{m=JSON.parse(localStorage.getItem('contacts-sync-v1')||'null');}catch(e){}
  if(!m||!Array.isArray(m.contacts)||!m.contacts.length)return;
  const last=await tx('meta','readonly',s=>s.get('syncTs'));
  if(last&&last.v>=m.ts)return;
  await loadAll();
  const mine=new Map(contacts.filter(c=>c.src==='old').map(c=>[c.name,c]));
  const free=new Map(contacts.filter(c=>!c.src).map(c=>[c.name+'|'+c.phone,c]));
  const seen=new Set(),out=[];
  for(const c of m.contacts){
    if(!c||!c.name)continue;seen.add(c.name);
    const ex=mine.get(c.name)||free.get(c.name+'|'+(c.phone||''));
    out.push(norm({...c,id:ex?ex.id:undefined,src:'old'}));
  }
  const gone=contacts.filter(c=>c.src==='old'&&!seen.has(c.name));
  const changed=out.length!==mine.size||gone.length||out.some(o=>{const e=contacts.find(c=>c.id===o.id);return !e||JSON.stringify(norm(e))!==JSON.stringify(o);});
  if(changed){
    await snapshot('before-sync');
    await tx('contacts','readwrite',s=>{gone.forEach(c=>s.delete(c.id));out.forEach(c=>s.put(c));});
    await loadAll();render();
  }
  await tx('meta','readwrite',s=>s.put({k:'syncTs',v:m.ts}));
  setStatus(contacts.length+' contacts · synced from the old page '+new Date(m.ts).toLocaleTimeString());
}
addEventListener('storage',e=>{if(e.key==='contacts-sync-v1')syncFromOld();});
addEventListener('focus',()=>syncFromOld());

(async()=>{
  try{navigator.storage&&navigator.storage.persist&&await navigator.storage.persist();}catch(e){}
  db=await open();await loadAll();
  const last=(await tx('snaps','readonly',s=>s.getAll())).pop();
  if(contacts.length&&(!last||Date.now()-last.ts>864e5))await snapshot('daily');
  render();
  const seeded=await tx('meta','readonly',s=>s.get('seeded'));
  if(!seeded&&!contacts.length&&!bookmarks.length){
    await importOld();await tx('meta','readwrite',s=>s.put({k:'seeded',v:1}));
    await snapshot('initial-import');
  }
  await syncFromOld();
  if(!contacts.length&&!bookmarks.length)setStatus('Empty. Open Backup ⚙ to restore a file.');
})();
</script>
</body>
</html>
